<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notification Platform</title>
<meta name="description" content="Live console for a reliable notification platform: transactional outbox, at-least-once delivery, idempotent effects.">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e4fd8'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
<script>try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* storage unavailable: follow the system */ }</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">N</div>
      <div>
        <div class="brand-name">Notification Platform</div>
        <div class="brand-sub">Reliable notification delivery</div>
      </div>
    </div>

    <nav id="nav" class="nav">
      <a href="#/start" data-route="start">Start</a>
      <div class="nav-group">Observe</div>
      <a href="#/overview" data-route="overview">Overview</a>
      <a href="#/events" data-route="events">Events</a>
      <a href="#/health" data-route="health">Health</a>
      <a href="#/experiment" data-route="experiment" id="nav-experiment" hidden>Experiment</a>
      <div class="nav-group">Try it</div>
      <a href="#/create" data-route="create">Create</a>
      <a href="#/faults" data-route="faults">Failures</a>
      <a href="#/dlq" data-route="dlq">Dead letters</a>
      <a href="#/idempotency" data-route="idempotency">Duplicates</a>
    </nav>

    <div class="sidebar-foot">
      <div id="api-pill" class="pill pill-unknown"><span class="dot"></span><span id="api-pill-text">Checking API…</span></div>
      <a id="email-pill" class="pill pill-warn" href="#/idempotency" hidden><span class="dot"></span><span id="email-pill-text"></span></a>
      <div class="theme-row">
        <button type="button" class="theme-btn" id="theme" aria-label="Colour theme"></button>
        <span class="muted small" id="theme-label"></span>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="page-title">Overview</h1>
        <p id="page-desc" class="page-desc"></p>
      </div>
      <div class="topbar-actions">
        <input type="password" id="admin-token" class="token" placeholder="Admin token" autocomplete="off" aria-label="Admin token">
        <span id="updated" class="muted small" role="status"></span>
        <label class="switch" title="Refreshes the data on this page every 1.5 seconds. Turn it off to freeze the screen, for example to read it or take a screenshot.">
          <input type="checkbox" id="live" checked>
          <span class="switch-track"></span>
          <span class="switch-label">Auto-refresh</span>
        </label>
      </div>
    </header>

    <div id="views"></div>
  </main>
</div>

<div id="drawer-backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <div class="drawer-head">
    <div>
      <div class="muted small">Event</div>
      <h2 id="drawer-title" class="mono">—</h2>
    </div>
    <button class="btn btn-ghost" id="drawer-close" aria-label="Close details">Close</button>
  </div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
