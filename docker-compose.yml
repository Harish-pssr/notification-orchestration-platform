name: notifplatform

# Same file locally and on the VM (D10). Postgres and NATS are not published to
# the host here; docker-compose.dev.yml adds those ports for local development.

x-postgres: &postgres
  image: postgres:17-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-notif}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notif}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    interval: 2s
    timeout: 3s
    retries: 30

x-app-env: &app-env
  PLATFORM_DSN: postgres://${POSTGRES_USER:-notif}:${POSTGRES_PASSWORD:-notif}@postgres-platform:5432/platform?sslmode=disable
  PROVIDER_DSN: postgres://${POSTGRES_USER:-notif}:${POSTGRES_PASSWORD:-notif}@postgres-provider:5432/provider?sslmode=disable
  NATS_URL: nats://nats:4222
  PROVIDER_URL: http://provider:9090
  # Fault injection is off unless explicitly enabled (D8). Set both in .env to use it.
  FAULTS_ENABLED: ${FAULTS_ENABLED:-false}
  ADMIN_TOKEN: ${ADMIN_TOKEN:-}

services:
  postgres-platform:
    <<: *postgres
    # Many relays and consumers each hold a few connections; the default of 100 could
    # become the limit during scaling benchmarks, so it is raised (recorded in docs).
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notif}
      POSTGRES_DB: platform
    volumes: [pg-platform:/var/lib/postgresql/data]

  # Separate instance so the "external" provider really is external (D5, D10).
  postgres-provider:
    <<: *postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notif}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notif}
      POSTGRES_DB: provider
    volumes: [pg-provider:/var/lib/postgresql/data]

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]   # JetStream on, file storage, monitoring port
    volumes: [nats-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate-platform:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: migrate } }
    command: ["platform"]
    environment: *app-env
    depends_on:
      postgres-platform: { condition: service_healthy }
    restart: "no"

  migrate-provider:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: migrate } }
    command: ["provider"]
    environment: *app-env
    depends_on:
      postgres-provider: { condition: service_healthy }
    restart: "no"

  provider:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: provider } }
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate-provider: { condition: service_completed_successfully }

  relay:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: relay } }
    restart: unless-stopped
    environment: *app-env
    depends_on:
      migrate-platform: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  consumer-email:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: consumer } }
    restart: unless-stopped
    environment: { <<: *app-env, CHANNEL: email }
    depends_on:
      migrate-platform: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      provider: { condition: service_started }

  consumer-push:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: consumer } }
    restart: unless-stopped
    environment: { <<: *app-env, CHANNEL: push }
    depends_on:
      migrate-platform: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      provider: { condition: service_started }

  consumer-webhook:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: consumer } }
    restart: unless-stopped
    environment: { <<: *app-env, CHANNEL: webhook }
    depends_on:
      migrate-platform: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
      provider: { condition: service_started }

  api:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: api } }
    restart: unless-stopped
    environment: *app-env
    ports: ["127.0.0.1:8080:8080"]   # loopback only; in production Caddy is the public entry (docker-compose.prod.yml)
    depends_on:
      migrate-platform: { condition: service_completed_successfully }
      nats: { condition: service_healthy }

  # Benchmark load generator (D13). It runs inside the Compose network so Docker
  # Desktop's host port forwarding is never in the measurement:
  #   docker compose --profile bench run --rm loadgen run -url http://api:8080 -rate 200 -duration 60s
  loadgen:
    build: { context: ., dockerfile: deploy/Dockerfile, args: { SERVICE: loadgen } }
    profiles: ["bench"]
    environment: *app-env
    restart: "no"

  # Metrics (D9). Prometheus finds every relay and consumer replica through Compose DNS.
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Optional dashboards: docker compose --profile grafana up -d
  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["grafana"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  pg-platform:
  pg-provider:
  nats-data:
  prometheus-data:
  grafana-data:
