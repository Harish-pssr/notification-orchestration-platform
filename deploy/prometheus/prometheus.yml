# Prometheus scrape configuration (D9). Compose's DNS returns one address per replica
# for a service name, so dns_sd_configs finds every relay and consumer instance as you
# scale them, with no configuration change.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:8080"] }]

  - job_name: provider
    static_configs: [{ targets: ["provider:9090"] }]

  - job_name: relay
    dns_sd_configs: [{ names: ["relay"], type: A, port: 9100 }]

  - job_name: consumer-email
    dns_sd_configs: [{ names: ["consumer-email"], type: A, port: 9100 }]

  - job_name: consumer-push
    dns_sd_configs: [{ names: ["consumer-push"], type: A, port: 9100 }]

  - job_name: consumer-webhook
    dns_sd_configs: [{ names: ["consumer-webhook"], type: A, port: 9100 }]
